; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev
; Keep PlatformIO packages on D: next to this repo (the VS Code extension too).
core_dir = ${PROJECT_DIR}/../../.platformio-local

[env]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 460800
upload_port = COM7
monitor_port = COM7
lib_deps =
    adafruit/Adafruit SSD1306 @ 2.5.13
    adafruit/Adafruit GFX Library @ 1.12.1

; Adopted RMS-normalized, log-compressed spectrum classifier.
[env:esp32dev]
build_flags = -DWOOD_USE_SPECTRUM=1

; Explicit alias for the adopted default spectrum model.
[env:esp32dev_spectrum]
build_flags = -DWOOD_USE_SPECTRUM=1

; Retained legacy time-domain model for comparison.
[env:esp32dev_time]
build_flags = -DWOOD_USE_SPECTRUM=0
